name: CI

on:
  push:
    branches: [main, development]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: opentide schemas
        run: pip install -r scripts/requirements-opentide.txt
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: io-free engines
        run: bash scripts/check-io-free.sh
      - name: names
        run: bash scripts/check-names.sh
      - name: skills
        run: bash scripts/validate-skills.sh
      - name: test
        run: cargo test --workspace
      - name: generate-highlights --check
        run: cargo run -p opentide-lsp -- generate-highlights --check

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "maturin>=1.7,<2"
      - run: maturin build

  grammars:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --prefix /tmp/ts-cli tree-sitter-cli@0.25.10
      - run: bash scripts/check-grammars.sh

  oracle:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/ci-oracle.sh

  # Every public Elastic rule passes Elasticsearch's parser, so any engine
  # error on them is an engine bug (#82). The rules are ELv2: checked out
  # here at a pinned commit, never vendored.
  elastic-sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: elastic/detection-rules
          ref: 2b30453d7dede69f980472cff51a2ae9a6917bae
          path: detection-rules
          sparse-checkout: |
            rules
            rules_building_block
            hunting
      - uses: dtolnay/rust-toolchain@stable
      - name: detection-rules sweep
        env:
          OPENTIDE_DETECTION_RULES: ${{ github.workspace }}/detection-rules
        run: cargo test -p opentide-analysis --test elastic_detection_rules -- --nocapture

  # Elasticsearch's EQL grammar, @elastic/esql, Kibana's KQL grammar, and the
  # Lucene query parser, fetched at pinned versions and never shipped (#83).
  elastic-oracle:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: elastic/detection-rules
          ref: 2b30453d7dede69f980472cff51a2ae9a6917bae
          path: detection-rules
          sparse-checkout: |
            rules
            rules_building_block
            hunting
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: bash scripts/ci-oracle-elastic.sh "$GITHUB_WORKSPACE/detection-rules"
