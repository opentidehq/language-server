name: Oracle

# CI-only differential oracles (scripts/oracles/README.md). The engine is
# compared with Microsoft Kusto.Language, Splunk's search parser, and the
# Elastic and Lucene parsers (@elastic/esql, EqlBase.g4, Kibana's kuery
# grammar, Lucene's QueryParser). A
# disagreement not listed in testdata/oracles/exceptions.toml is a red build,
# and so is a listed one that is gone. The references never ship; release.yml
# runs scripts/license-scan.sh on every artifact.
on:
  push:
    branches: [main, development]
    tags: ["v*.*.*"]
  pull_request:
    paths:
      - "crates/**"
      - "grammars/**"
      - "catalogs/kql/**"
      - "catalogs/spl/**"
      - "catalogs/esql/**"
      - "catalogs/eql/**"
      - "testdata/**"
      - "scripts/oracles/**"
      - "scripts/ci-oracle.sh"
      - ".github/workflows/oracle.yml"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  OPENTIDE_ORACLE_REQUIRED: "1"

jobs:
  kql:
    name: Kusto.Language
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: bash scripts/ci-oracle.sh kql

  spl:
    name: Splunk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      # Not a service container: splunkd takes minutes to start and the runner's
      # readiness check needs a health status, so start.sh runs it and
      # oracle.py waits. Starting it accepts the Splunk General Terms for this
      # throwaway instance, bound to 127.0.0.1, which only answers search/parser.
      - name: Splunk oracle
        run: |
          eval "$(bash scripts/oracles/splunk/start.sh)"
          bash scripts/ci-oracle.sh spl

  elastic:
    name: Elastic and Lucene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Elastic's public rules (ELv2), read at CI time and never vendored.
      # Elasticsearch accepts every one, so they are queries the engine must
      # not reject. Same pin as the elastic-sweep job in ci.yml.
      - uses: actions/checkout@v4
        with:
          repository: elastic/detection-rules
          ref: 2b30453d7dede69f980472cff51a2ae9a6917bae
          path: detection-rules
          sparse-checkout: |
            rules
            rules_building_block
            hunting
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Elastic oracles
        env:
          OPENTIDE_DETECTION_RULES: ${{ github.workspace }}/detection-rules
        run: bash scripts/ci-oracle.sh esql eql kuery lucene
