# TEMPORARY: reproduce the WASI smoke segfault of #227 with a native backtrace
# and keep the built artifact. Never merged.
name: wasm-debug
on:
  pull_request:
    branches: [claude/yara-1-toolchain-plumbing]
jobs:
  wasm-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown, wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.128
      - run: bash scripts/build-wasm.sh wasi || true
      - run: sudo apt-get install -y gdb >/dev/null
      - run: grep -m1 'model name' /proc/cpuinfo; node --version; sha256sum target/wasm32-wasip1/release/opentide-lsp.wasm
      - name: variants (5 runs each)
        shell: bash
        run: |
          w=target/wasm32-wasip1/release/opentide-lsp.wasm
          try() { local label=$1; shift; local fails=0; for i in 1 2 3 4 5; do "$@" scripts/wasm-smoke.mjs wasi $w >/dev/null 2>&1 || fails=$((fails+1)); done; echo "$label: $fails/5 failed"; }
          try "node22 default" node
          try "node22 --no-turbo-fast-api-calls" node --no-turbo-fast-api-calls
          try "node22 --no-liftoff" node --no-liftoff
          try "node22 --max-old-space-size=8192" node --max-old-space-size=8192
          for v in 24 25; do npx -y node@$v --version >/dev/null 2>&1; try "node$v" npx -y node@$v; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: opentide-lsp-wasi
          path: target/wasm32-wasip1/release/opentide-lsp.wasm
