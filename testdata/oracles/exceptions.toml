# Known disagreements between the opentide engine and the reference parsers.
# scripts/ci-oracle.sh enforces this file (see scripts/oracles/README.md):
#
# - A query where ours and the reference disagree fails CI unless an entry
#   lists it in `paths`. Paths are repository-relative; a query inside a Tide
#   rule is `<file>#configurations.<platform>.<field>`.
# - A function, plugin or command name the two sides disagree on fails CI
#   unless an entry lists it in `names`.
# - A listed path or name that no longer disagrees fails CI too. Delete it
#   in the change that fixes it.
#
# Every entry has an `id`, a `reason`, and exactly one of `paths` or `names`.
# The references are CI-only. Do not ship Microsoft Kusto.Language, Splunk,
# or a Splunk SDK in any release artifact (scripts/license-scan.sh).

# ---------------------------------------------------------------------------
# KQL: Microsoft Kusto.Language
# ---------------------------------------------------------------------------

# Grammar gaps. Each probe in testdata/oracles/kql/ is one form taken from a
# real Sentinel or Defender rule that Kusto.Language accepts and ours rejects.

[[kql]]
id = "kql-summarize-named-aggregate"
reason = "`summarize Name = agg(...)` fails to parse. Almost every Sentinel rule names its aggregates (StartTime = min(TimeGenerated))."
paths = ["testdata/oracles/kql/summarize_named_aggregate.kql"]

[[kql]]
id = "kql-multi-value-list"
reason = "A list with more than one value after `in`, `in~`, `!in` or `has_any` fails to parse; a single value parses."
paths = [
  "testdata/oracles/kql/in_list.kql",
  "testdata/oracles/kql/in_case_insensitive_list.kql",
  "testdata/oracles/kql/has_any_list.kql",
]

[[kql]]
id = "kql-dynamic-literal"
reason = "`dynamic([...])` and `dynamic({...})` literals fail to parse, and ours also reports `dynamic` as an unknown function."
paths = ["testdata/oracles/kql/dynamic_literal.kql"]

[[kql]]
id = "kql-between"
reason = "`between (a .. b)` fails to parse, although `between` is in catalogs/kql/core/operators-scalar.toml."
paths = ["testdata/oracles/kql/between.kql"]

[[kql]]
id = "kql-member-and-index-access"
reason = "Member access after a call (`parse_xml(x).a.b`) and indexing (`split(x, y)[-1]`) fail to parse."
paths = [
  "testdata/oracles/kql/member_access.kql",
  "testdata/oracles/kql/array_index.kql",
]

[[kql]]
id = "kql-mv-expand-mv-apply"
reason = "`mv-expand Name = Column` and `mv-apply ... on (subquery)` fail to parse; plain `mv-expand Column` parses."
paths = [
  "testdata/oracles/kql/mv_expand_assignment.kql",
  "testdata/oracles/kql/mv_apply.kql",
]

[[kql]]
id = "kql-union-options"
reason = "`union isfuzzy=true T1, T2` fails to parse."
paths = ["testdata/oracles/kql/union_isfuzzy.kql"]

[[kql]]
id = "kql-tabular-let"
reason = "A parenthesized tabular `let` (`let X = (T | ...);`) and a tabular function (`let f = (t: string) { ... };`) fail to parse."
paths = [
  "testdata/oracles/kql/parenthesized_tabular_let.kql",
  "testdata/oracles/kql/tabular_function_let.kql",
]

[[kql]]
id = "kql-make-series-datatable-print"
reason = "`make-series`, `datatable(...) [...]` and a named `print` column (`print Now = now()`) fail to parse."
paths = [
  "testdata/oracles/kql/make_series.kql",
  "testdata/oracles/kql/datatable.kql",
  "testdata/oracles/kql/print_assignment.kql",
]

[[kql]]
id = "kql-real-rules-hit-grammar-gaps"
reason = "Real rules that use the forms above (named aggregates, multi-value lists, dynamic literals, member access, mv-expand/mv-apply, union options, tabular lets). external_corpus.rs checks a parsing prefix of each; the oracle checks the whole rule."
paths = [
  "testdata/conformance/external/kql/ADFSDBNamedPipeConnection.kql",
  "testdata/conformance/external/kql/ADFSDomainTrustMods.kql",
  "testdata/conformance/external/kql/ADFSRemoteAuthSyncConnection.kql",
  "testdata/conformance/external/kql/ADFSRemoteHTTPNetworkConnection.kql",
  "testdata/conformance/external/kql/ADFSSignInLogsPasswordSpray.kql",
  "testdata/conformance/external/kql/AccountCreatedDeletedByNonApprovedUser.kql",
  "testdata/conformance/external/kql/AccountCreatedandDeletedinShortTimeframe.kql",
  "testdata/conformance/external/kql/AdminPromoAfterRoleMgmtAppPermissionGrant.kql",
  "testdata/conformance/external/kql/AnomalousUserAppSigninLocationIncrease-detection.kql",
  "testdata/conformance/external/kql/ExcessiveLogonFailures.kql",
  "testdata/conformance/external/kql/ExchangeOABVirtualDirectoryAttributeContainingPotentialWebshell.kql",
  "testdata/conformance/external/kql/GainCodeExecutionADFSViaSMB.kql",
  "testdata/conformance/external/kql/LocalDeviceJoinInfoAndTransportKeyRegKeysAccess.kql",
  "testdata/conformance/external/kql/MultipleFailedFollowedBySuccess.kql",
  "testdata/conformance/external/kql/SigninBruteForce.kql",
  "testdata/objects/rules/shai-hulud-bulk-credential-candidate-file-access-on-developer-hosts.yaml#configurations.defender_for_endpoint.query",
]

# Corpus fixtures labelled invalid that Kusto.Language accepts.

[[kql]]
id = "kql-empty-operator-lists"
reason = "Kusto.Language parses and analyzes `T | project`, `project-away`, `project-rename` and `summarize` with nothing after them; our grammar requires at least one item."
paths = [
  "testdata/corpus/kql/project_operator__invalid.kql",
  "testdata/corpus/kql/project_away_operator__invalid.kql",
  "testdata/corpus/kql/project_rename_operator__invalid.kql",
  "testdata/corpus/kql/summarize_operator__invalid.kql",
]

[[kql]]
id = "kql-number-suffix"
reason = "Kusto.Language lexes `42x` as a name and rejects it only in semantic analysis (KS142); our lexer rejects it as a malformed number."
paths = ["testdata/corpus/kql/number__invalid.kql"]

[[kql]]
id = "kql-control-command-arguments"
reason = "Kusto.Language parses the whole `.create table X (a:string)` command; our grammar parses only enough of a control command to report kql_control_command_unsupported, which still fires."
paths = ["testdata/corpus/kql/control_command__invalid.kql"]

# Names: catalogs/kql/core against Kusto.Language GlobalState.Default.

[[kql]]
id = "kql-log-analytics-functions"
reason = "Log Analytics / Sentinel functions. Kusto.Language's default GlobalState holds Azure Data Explorer functions only."
names = ["_GetWatchlist", "workspace"]

[[kql]]
id = "kql-special-forms"
reason = "Kusto.Language parses `materialize(...)` and `toscalar(...)` as their own syntax, not as function symbols."
names = ["materialize", "toscalar"]

[[kql]]
id = "kql-plugin-name-case"
reason = "Learn titles the plugin `R`; Kusto.Language names it `r`, which is the spelling `evaluate r(...)` needs. Plugin names are case-sensitive."
names = ["R", "r"]

[[kql]]
id = "kql-percentiles-array-tdigest"
reason = "The catalog has `percentile_array_tdigest` (from the Learn page slug); Kusto.Language knows `percentiles_array_tdigest`."
names = ["percentile_array_tdigest", "percentiles_array_tdigest"]

[[kql]]
id = "kql-plugins-missing-from-kusto-language"
reason = "Documented on Learn and in catalogs/kql/core/evaluate-plugins.toml, but absent from Kusto.Language 12.4.1."
names = ["diffpatterns_text", "schema_merge"]

[[kql]]
id = "kql-evaluate-plugin-flagged"
reason = "`bag_unpack` is in both catalogs, but ours reports kql_unknown_function for `evaluate bag_unpack(...)` in real rules."
names = ["bag_unpack"]

[[kql]]
id = "kql-deprecated-aliases"
reason = "Obsolete names Kusto.Language still resolves. Real rules use them (SigninBruteForce: makelist; ADFS rules: any), and ours reports kql_unknown_function where a deprecation warning is due."
names = [
  "any", "anyif", "argmax", "argmin", "cnt", "makelist", "makeset",
  "columnifexists", "current_cursor", "datepart", "extentid", "make_string",
  "notnull", "row_rank", "to_utf8", "toobject", "totime", "ai_embed_text",
]

[[kql]]
id = "kql-hidden-symbols"
reason = "Hidden in Kusto.Language (no Learn page) but still resolved; ours reports kql_unknown_function."
names = [
  "current_node_id", "hll_isvalid", "iscolumnexists", "rowstore_ordinal_range",
  "tdigest_isvalid", "make_dictionary", "passthrough", "dax_request", "postgresql_request",
]

[[kql]]
id = "kql-functions-missing-from-catalog"
reason = "Kusto.Language functions and aggregates not in catalogs/kql/core/functions.toml; ours reports kql_unknown_function on valid queries."
names = [
  "all", "around", "array_strcat", "assert", "bag_zip", "base64_encode_fromarray",
  "datetime_list_timezones", "dynamic_to_json", "entity_group", "external_table",
  "format_bytes", "getmonth", "graph", "gzip_compress_to_base64_string",
  "gzip_decompress_from_base64_string", "inner_nodes", "isascii", "isutf8", "labels",
  "map", "materialized_view", "new_guid", "node_degree_in", "node_degree_out", "node_id",
  "punycode_domain_from_string", "punycode_domain_to_string", "regex_quote", "row_id",
  "set_equals", "stored_query_result", "string_size", "unicode_codepoints_from_string",
  "unicode_codepoints_to_string", "week_of_year", "zlib_compress_to_base64_string",
  "zlib_decompress_from_base64_string",
  "covariance", "covarianceif", "covariancep", "covariancepif", "percentilew",
]

[[kql]]
id = "kql-plugins-missing-from-catalog"
reason = "Kusto.Language plugins not in catalogs/kql/core/evaluate-plugins.toml. Most are Azure Data Explorer only (http_request, execute_query, csharp); ours reports them as unknown."
names = [
  "active_users_count", "activity_counts_metrics", "activity_engagement", "activity_metrics",
  "ai_chat_completion", "ai_chat_completion_prompt", "ai_embeddings", "csharp",
  "estimate_rows_count", "execute_query", "execute_show_command", "external_datatable",
