# Corpus fixtures labelled invalid where Splunk disagrees.

[[spl]]
id = "spl-trailing-pipe"
reason = "Splunk ignores an empty trailing pipeline stage (`search |`, `index=main |`); ours reports a syntax error."
paths = [
  "testdata/corpus/spl/search_command__invalid.spl",
  "testdata/corpus/spl/unknown_command__invalid.spl",
]

[[spl]]
id = "spl-argumentless-commands"
reason = "Splunk's search parser accepts `fields`, `lookup`, `stats` and `where` with no arguments; ours rejects them."
paths = [
  "testdata/corpus/spl/fields_command__invalid.spl",
  "testdata/corpus/spl/lookup_command__invalid.spl",
  "testdata/corpus/spl/stats_command__invalid.spl",
  "testdata/corpus/spl/where_command__invalid.spl",
]

[[spl]]
id = "spl-leading-word-is-a-search-term"
reason = "Without a leading `|`, Splunk reads `index` and `tstats` as search terms of the implicit `search`; ours reads them as commands."
paths = [
  "testdata/corpus/spl/bare_search__invalid.spl",
  "testdata/corpus/spl/tstats_command__invalid.spl",
]

[[spl]]
id = "spl-dedup-without-fields"
reason = "Ours accepts `dedup` with no field although the fixture is labelled invalid; Splunk requires at least one field."
paths = ["testdata/corpus/spl/dedup_command__invalid.spl"]

# Names: catalogs/spl/commands.toml against Splunk searchbnf.conf.

[[spl]]
id = "spl-command-aliases"
reason = "searchbnf aliases (transam = transaction, summaryindex = collect, ...) missing from catalogs/spl/commands.toml; ours reports spl_unknown_command."
names = [
  "af", "ar", "common", "counttable", "ctable", "discretize", "excerpt", "hilite",
  "macro", "maketable", "outlierfilter", "run", "savedsplunk", "slc", "stash",
  "sumindex", "summaryindex", "transam",
]

[[spl]]
id = "spl-public-commands-missing"
reason = "searchbnf marks these usage = public but they are not in the Search Reference-derived catalog; ours reports spl_unknown_command."
names = ["federate", "ingestpreview", "oldreturn"]

[[spl]]
id = "spl-internal-commands"
reason = "searchbnf marks these usage = internal, debug or deprecated. They are not for detections, but Splunk still runs them."
names = [
  "createrss", "debug", "dump", "editinfo", "findkeywords", "makejson", "mcatalog",
  "mrollup", "nokv", "outputraw", "outputtelemetry", "prjob", "rawstats",
  "runshellscript", "showargs", "surrounding",
]
