# Oracles are CI-only. Do not ship Microsoft Kusto.Language or Splunk SDKs
# in the language-server binary.

[[kql]]
id = "control-command-syntax"
reason = "Control commands are parsed by our grammar but rejected as detections."

[[spl]]
id = "implicit-search-prefix"
reason = "Authored text is not rewritten with an implicit `| search`."

# Elastic oracles (scripts/ci-oracle-elastic.sh). The oracles are parsers;
# these engine codes are checks Elasticsearch makes after parsing, so an
# engine error made only of them is expected where the parser accepts.
[elastic.beyond_parser]
esql = ["esql_unknown_function", "esql_unavailable"]
eql = [
  "eql_unknown_function",
  "eql_function_arity",
  "eql_unsupported",
  "eql_maxspan_unit",
  "eql_argument_type",
  "eql_field_comparison",
]
kuery = []
lucene = []

[[esql]]
file = "^corpus__unknown_command__valid"
reason = "An unknown command parses on purpose so esql_unknown_command can name it; Elasticsearch rejects it."

[[esql]]
file = "^corpus__(completion_command__valid\\.endpoint|metadata__valid\\.bracketed)"
reason = "8.19-only forms (`COMPLETION ... WITH endpoint`, `FROM x [METADATA ...]`): the engine accepts them with a version warning; @elastic/esql follows Elasticsearch main, which removed them."

[[eql]]
file = "^corpus__(sample|subquery|term_option)__invalid"
reason = "Elasticsearch's LogicalPlanBuilder rejects these after the grammar accepts them (sample without join keys, missing events without maxspan, unknown term option), as a ParsingException; the engine reports them as eql_parse_error too."

[[kuery]]
file = "^corpus__(and_list|not_list|or_list|or_query)__invalid"
reason = "Known engine bug (#79): Kibana reads a trailing `or`/`and`/`not` as a value word, so these parse there. Remove once the engine accepts them."
